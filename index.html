<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercearia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mercearia</h1>

    <p>Descubra o valor do seu troco aqui!</p>

    <div>
        <label for="unitario">Preço unitário do produto: </label>
        <input type="number" id="unitario" placeholder="Digite aqui o Preço">
    
        <label for="quantidade">Quantidade comprada: </label>
        <input type="number" id="quantidade" placeholder="Digite aqui a quantidade">

        <label for="dinheiro">Dinheiro recebido: </label>
        <input type="number" id="dinheiro" placeholder="Digite o dinheiro recebido ">
    </div>


    <button>Calcular troco</button>

    <p id="TROCO"></p>

    <script src="script.js"></script>
</body>
</html>
